# ChirpStack Gateway Bridge Configuration
# Connects physical LoRaWAN gateways (e.g., Dragino LPS8N) to ChirpStack
#
# Your Dragino gateway's packet forwarder should point to this server's
# IP address on UDP port 1700.

[integration.mqtt]
  [integration.mqtt.auth]
    type = "generic"
    [integration.mqtt.auth.generic]
      servers = ["tcp://mosquitto:1883/"]

[backend]
  type = "semtech_udp"

  [backend.semtech_udp]
    udp_bind = "0.0.0.0:1700"
